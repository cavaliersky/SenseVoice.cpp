name: Build-SenseVoice-32bit-ONLY

on:
  workflow_dispatch: 

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          repository: 'cavaliersky/SenseVoice.cpp'
          submodules: recursive

      - name: 2. 安装 NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c 
          add-to-path: true

      - name: 3. 安装必备工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: 4. 执行交叉编译
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DANDROID_ARM_NEON=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: 5. 智能提取可执行程序 (修复 libomp 依赖)
        run: |
          mkdir -p release_output
          
          # 提取主程序和自己编译的 .so
          find build -type f -executable ! -name "*.*" -exec cp {} release_output/ \; || true
          find build -type f -name "*.so" -exec cp {} release_output/ \; || true
          
          # 【关键新增】从官方 NDK 里面强行找出 32 位专用的 libomp.so 并打包
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          find "$NDK_PATH" -type f -name "libomp.so" | grep "arm-linux-androideabi" | head -n 1 | xargs -I {} cp {} release_output/
          
          echo "==== 本次提取的干净文件如下 ===="
          ls -lh release_output/

      - name: 6. 打包供下载
        uses: actions/upload-artifact@v4
        with:
          name: SenseVoice-Android32-Termux
          path: release_output/
