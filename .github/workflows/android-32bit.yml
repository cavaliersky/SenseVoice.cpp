name: Build-SenseVoice-32bit-ONLY

on:
  workflow_dispatch: 

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4
        with:
          repository: 'cavaliersky/SenseVoice.cpp'
          submodules: recursive

      - name: 2. 安装 NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c 
          add-to-path: true

      - name: 3. 安装必备工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: 4. 执行交叉编译
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DANDROID_ARM_NEON=ON \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: 5. 智能提取文件 (彻底修复软链接跳过问题)
        run: |
          mkdir -p release_output
          
          # 1. 提取主程序和动态库（加入了 -L，强制剥开快捷方式复制真文件）
          find build -type f -executable ! -name "*.*" -exec cp -L {} release_output/ \; || true
          find build -name "*.so" -exec cp -L {} release_output/ \; || true
          
          # 2. 专门提取 32位 libomp.so (去掉 -type f 的限制，并追踪源文件)
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          OMP_FILE=$(find "$NDK_PATH" -name "libomp.so" | grep "arm-linux-androideabi" | head -n 1)
          
          if [ -n "$OMP_FILE" ]; then
            echo "成功找到 libomp.so: $OMP_FILE"
            cp -L "$OMP_FILE" release_output/
          else
            echo "【错误】没有找到 libomp.so"
          fi
          
          echo "==== 本次将要打包给你的文件 ===="
          ls -lh release_output/

      - name: 6. 打包供下载
        uses: actions/upload-artifact@v4
        with:
          name: SenseVoice-Android32-Termux
          path: release_output/
